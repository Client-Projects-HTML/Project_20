<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unpainted Canvas - 404 Page | ColorCraft</title>
<meta name="description" content="The page you're looking for has moved or no longer exists.">
<meta property="og:title" content="Unpainted Canvas - Page Not Found | ColorCraft">
<meta property="og:description" content="The page you're looking for has moved or no longer exists.">
<meta property="og:type" content="website">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
<link rel="stylesheet" href="../assets/css/dark-mode.css">
<link rel="stylesheet" href="../assets/css/rtl.css">
<link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png">
</head>
<body class="luxury-page-bg">

  <main class="luxury-card-container">
    <div class="luxury-card">
      
      <!-- Card Header -->
      <div class="luxury-header">
        <a href="index.html" class="luxury-brand">
          <img src="../assets/images/logo-icon.svg" alt="ColorCraft Logo" class="luxury-brand-logo">
          <div class="luxury-brand-text">
            <span class="luxury-brand-title">COLORCRAFT</span>
            <span class="luxury-brand-sub">PAINTING SERVICES</span>
          </div>
        </a>

        <div class="luxury-nav-actions">
          <button type="button" class="luxury-icon-btn" id="theme-toggle" data-theme-toggle aria-label="Toggle Dark/Light Mode" title="Toggle Theme">
            <i class="bi bi-sun" id="theme-icon"></i>
          </button>
          <button type="button" class="luxury-icon-btn" id="rtl-toggle" data-rtl-toggle aria-label="Toggle RTL Mode" title="Toggle Language / RTL">
            <i class="bi bi-globe"></i>
          </button>
        </div>
      </div>

      <!-- Main Body -->
      <h1 class="luxury-404-num">404</h1>
      <h2 class="luxury-heading">Unpainted Canvas</h2>
      <p class="luxury-desc">The page or shade you are trying to reach has not been painted yet.<br>Let's guide you back to our main palette.</p>
      
      <hr class="luxury-divider">

      <a href="index.html" class="luxury-pill-btn">
        <i class="bi bi-arrow-left"></i> Back to Home
      </a>

    </div>

    <!-- Outer Footer -->
    <div class="luxury-footer">
      <p>© 2026 ColorCraft. All rights reserved.</p>
      <p>Developed by <a href="https://abhivorn.com" target="_blank" rel="noopener">Abhivorn Technologies Pvt. Ltd.</a></p>
    </div>
  </main>

  <script>
    // Theme Toggle Handler
    const themeBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('cc-theme', theme);
      if (theme === 'dark') {
        themeIcon.className = 'bi bi-sun';
      } else {
        themeIcon.className = 'bi bi-moon-stars';
      }
    }

    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        applyTheme(newTheme);
      });
    }

    // RTL Toggle Handler
    const rtlBtn = document.getElementById('rtl-toggle');
    function applyRTL(dir) {
      document.documentElement.setAttribute('dir', dir);
      localStorage.setItem('cc-dir', dir);
    }

    if (rtlBtn) {
      rtlBtn.addEventListener('click', () => {
        const currentDir = document.documentElement.getAttribute('dir') || 'ltr';
        const newDir = currentDir === 'rtl' ? 'ltr' : 'rtl';
        applyRTL(newDir);
      });
    }

    // Restore Saved Theme & RTL State
    const savedTheme = localStorage.getItem('cc-theme') || 'dark';
    applyTheme(savedTheme);

    const savedDir = localStorage.getItem('cc-dir') || 'ltr';
    applyRTL(savedDir);
  </script>

</body>
</html>
