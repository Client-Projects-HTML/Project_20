<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ColorCraft</title>
  
  <!-- FontAwesome & Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  
  <!-- ColorCraft Stylesheet -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">  

  <style>
    /* Tabs for Role Switching */
    .role-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .role-tab-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border, #ced4da);
      background: var(--surface, #ffffff);
      color: var(--ink, #212529);
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .role-tab-btn.active {
      background: var(--primary, #0F4C81);
      color: #ffffff;
      border-color: var(--primary, #0F4C81);
    }
  </style>
</head>
<body class="login-container">

  <!-- Login Card -->
  <main class="login-card">
    
    <!-- Controls inside card -->
    <div class="page-controls">
      <button type="button" class="icon-toggle icon-toggle-sm" id="theme-toggle" aria-label="Toggle Dark Mode" title="Toggle Theme">
        <i class="bi bi-moon-stars" id="theme-icon"></i>
      </button>
      <button type="button" class="icon-toggle icon-toggle-sm" id="rtl-toggle" aria-label="Toggle RTL" title="Toggle RTL Mode">
        <i class="bi bi-arrow-left-right"></i>
      </button>
    </div>

    <!-- Brand -->
    <a href="index.html" class="brand brand-center">
      <span class="brand-chip"></span>ColorCraft
    </a>
    
    <h2 id="login-title">Host Login</h2>
    <p class="subtitle" id="login-subtitle">Please enter your host details to sign in.</p>

    <!-- Role Switcher -->
    <div class="role-tabs">
      <button type="button" class="role-tab-btn active" id="tab-host">
        <i class="fa-solid fa-user me-1"></i> Host Login
      </button>
      <button type="button" class="role-tab-btn" id="tab-admin">
        <i class="fa-solid fa-user-shield me-1"></i> Admin Login
      </button>
    </div>

    <!-- Dynamic Form for Host and Admin -->
    <form class="login-form" id="auth-form">
      <div class="form-group">
        <label for="email">Email Address <span class="req">*</span></label>
        <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password <span class="req">*</span></label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign In as Host</button>
    </form>

  </main>

  <script>
    let currentRole = 'host';

    const tabHost = document.getElementById('tab-host');
    const tabAdmin = document.getElementById('tab-admin');
    const loginTitle = document.getElementById('login-title');
    const loginSubtitle = document.getElementById('login-subtitle');
    const submitBtn = document.getElementById('submit-btn');
    const authForm = document.getElementById('auth-form');

    // Switch to Host Login Mode
    tabHost.addEventListener('click', () => {
      currentRole = 'host';
      tabHost.classList.add('active');
      tabAdmin.classList.remove('active');
      loginTitle.textContent = 'Host Login';
      loginSubtitle.textContent = 'Please enter your host details to sign in.';
      submitBtn.textContent = 'Sign In as Host';
    });

    // Switch to Admin Login Mode
    tabAdmin.addEventListener('click', () => {
      currentRole = 'admin';
      tabAdmin.classList.add('active');
      tabHost.classList.remove('active');
      loginTitle.textContent = 'Admin Login';
      loginSubtitle.textContent = 'Enter admin credentials to open dashboard directly.';
      submitBtn.textContent = 'Sign In as Admin';
    });

    // Form Submission Handler
    authForm.addEventListener('submit', (e) => {
      e.preventDefault();

      if (currentRole === 'admin') {
        // Direct Authentication for Admin Dashboard
        sessionStorage.setItem('cc_session', '1');
        localStorage.setItem('cc_lastLogin', new Date().toISOString());
        
        // Redirect directly to the Admin Dashboard page
        window.location.href = '../admin/dashboard.html';
      } else {
        // Host Action
        alert('Logged in successfully as Host!');
      }
    });

    // Dark / Light Theme Toggle Functionality
    const themeBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('cc_theme', theme);
      
      // Toggle Icon between Moon and Sun
      if (theme === 'dark') {
        themeIcon.className = 'bi bi-sun';
      } else {
        themeIcon.className = 'bi bi-moon-stars';
      }
    }

    themeBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      applyTheme(newTheme);
    });

    // RTL Toggle
    document.getElementById('rtl-toggle').addEventListener('click', () => {
      const html = document.documentElement;
      const currentDir = html.getAttribute('dir');
      html.setAttribute('dir', currentDir === 'rtl' ? 'ltr' : 'rtl');
    });

    // Restore Saved Theme on Page Load
    const savedTheme = localStorage.getItem('cc_theme') || 'light';
    applyTheme(savedTheme);
  </script>

</body>
</html>
