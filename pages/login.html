<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ColorCraft</title>
  
  <!-- FontAwesome & Bootstrap Icons for consistency -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  
  <!-- ColorCraft Stylesheet -->
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="login-container">

  <!-- Login Card -->
  <main class="login-card">
    
    <!-- Theme & RTL Controls inside top-right of card -->
    <div class="page-controls">
      <button type="button" class="icon-toggle icon-toggle-sm" id="theme-toggle" aria-label="Toggle Dark Mode" title="Toggle Theme">
        <i class="bi bi-moon-stars"></i>
      </button>
      <button type="button" class="icon-toggle icon-toggle-sm" id="rtl-toggle" aria-label="Toggle RTL" title="Toggle RTL Mode">
        <i class="bi bi-arrow-left-right"></i>
      </button>
    </div>

    <!-- ColorCraft Brand Mark -->
    <a href="index.html" class="brand brand-center">
      <span class="brand-chip"></span>ColorCraft
    </a>
    
    <h2>Welcome Back</h2>
    <p class="subtitle">Please enter your details to sign in.</p>

    <!-- Form -->
    <form class="login-form">
      <div class="form-group">
        <label for="email">Email Address <span class="req">*</span></label>
        <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password <span class="req">*</span></label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>

    <!-- Admin Link Option -->
    <div class="admin-redirect">
      <i class="fa-solid fa-user-shield me-1"></i> Are you an administrator? 
      <a href="../admin/dashboard.html">Go to Admin Login &rarr;</a>
    </div>
  </main>

  <!-- Toggle Scripts -->
  <script>
    // Dark / Light Theme Toggle
    const themeBtn = document.getElementById('theme-toggle');
    themeBtn.addEventListener('click', () => {
      const html = document.documentElement;
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem('cc_theme', newTheme);
    });

    // RTL Toggle
    const rtlBtn = document.getElementById('rtl-toggle');
    rtlBtn.addEventListener('click', () => {
      const html = document.documentElement;
      const currentDir = html.getAttribute('dir');
      const newDir = currentDir === 'rtl' ? 'ltr' : 'rtl';
      html.setAttribute('dir', newDir);
    });

    // Restore saved theme state
    if (localStorage.getItem('cc_theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>

</body>
</html>
