<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - ColorCraft</title>
  
  <!-- FontAwesome & Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  
  <!-- ColorCraft Stylesheet -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">  

  <style>
    /* Tabs for Role Switching */
    .role-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .role-tab-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border, #ced4da);
      background: var(--surface, #ffffff);
      color: var(--ink, #212529);
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .role-tab-btn.active {
      background: var(--primary, #0F4C81);
      color: #ffffff;
      border-color: var(--primary, #0F4C81);
    }
    .password-field-wrap {
      position: relative;
    }
    .password-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--color-gray-600, #6c757d);
      cursor: pointer;
      padding: 4px;
      font-size: 1.1rem;
    }
    .signup-prompt {
      margin-top: 18px;
      font-size: 0.9rem;
      color: var(--color-gray-600, #6c757d);
    }
    .signup-prompt a {
      color: var(--color-primary, #0F4C81);
      font-weight: 600;
    }
    .terms-text {
      font-size: 0.78rem;
      color: var(--color-gray-600, #6c757d);
      margin-top: 16px;
      line-height: 1.4;
    }
    .terms-text a {
      color: var(--color-primary, #0F4C81);
      text-decoration: underline;
    }
  </style>
</head>
<body class="login-container">

  <!-- Top Navigation Bar -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand"><span class="brand-chip"></span>ColorCraft</a>

      <div class="nav-actions">
        <button type="button" class="icon-toggle" id="theme-toggle" aria-label="Toggle Dark Mode" title="Toggle Theme">
          <i class="bi bi-moon-stars" id="theme-icon"></i>
        </button>
        <button type="button" class="icon-toggle" id="rtl-toggle" aria-label="Toggle RTL" title="Toggle RTL Mode">
          <i class="bi bi-arrow-left-right"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Signup Card -->
  <main class="login-card" style="max-width:480px;">
    
    <h2 id="signup-title">Host Registration</h2>
    <p class="subtitle" id="signup-subtitle">Create a host account to manage your property finishing.</p>

    <!-- Role Switcher -->
    <div class="role-tabs">
      <button type="button" class="role-tab-btn active" id="tab-host">
        <i class="fa-solid fa-user me-1"></i> Host Sign Up
      </button>
      <button type="button" class="role-tab-btn" id="tab-admin">
        <i class="fa-solid fa-user-shield me-1"></i> Admin Sign Up
      </button>
    </div>

    <!-- Dynamic Form for Host and Admin Registration -->
    <form class="login-form" id="signup-form">
      <div class="form-group">
        <label for="fullname">Full Name <span class="req">*</span></label>
        <input type="text" id="fullname" class="form-control" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address <span class="req">*</span></label>
        <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number <span class="req">*</span></label>
        <input type="tel" id="phone" class="form-control" placeholder="+91 98765 43210" required>
      </div>

      <div class="form-group" id="role-extra-field">
        <label for="extra-input" id="extra-label">Property / Business Name <span class="req">*</span></label>
        <input type="text" id="extra-input" class="form-control" placeholder="e.g. ColorCraft Estates" required>
      </div>

      <div class="form-group">
        <label for="password">Password <span class="req">*</span></label>
        <div class="password-field-wrap">
          <input type="password" id="password" class="form-control" placeholder="••••••••" required style="padding-right:42px;" minlength="6">
          <button type="button" class="password-toggle-btn" id="toggle-password" aria-label="Toggle password visibility">
            <i class="bi bi-eye" id="eye-icon"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password <span class="req">*</span></label>
        <div class="password-field-wrap">
          <input type="password" id="confirm-password" class="form-control" placeholder="••••••••" required style="padding-right:42px;" minlength="6">
          <button type="button" class="password-toggle-btn" id="toggle-confirm-password" aria-label="Toggle confirm password visibility">
            <i class="bi bi-eye" id="eye-confirm-icon"></i>
          </button>
        </div>
      </div>

      <div class="form-group" style="text-align:left;margin-top:10px;">
        <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-size:0.85rem;font-weight:400;color:var(--color-gray-700);">
          <input type="checkbox" id="accept-terms" required style="margin-top:3px;">
          <span>I agree to ColorCraft's <a href="#" style="color:var(--color-primary);text-decoration:underline;">Terms of Service</a> &amp; <a href="#" style="color:var(--color-primary);text-decoration:underline;">Privacy Policy</a>.</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create Host Account</button>
      
      <!-- Go to Dashboard Button (Available for both Host and Admin) -->
      <a href="../admin/dashboard.html" class="btn btn-secondary btn-block" style="margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;" id="dashboard-btn">
        <i class="fa-solid fa-gauge"></i> Go to Dashboard
      </a>
    </form>

    <div class="signup-prompt">
      Already have an account? <a href="login.html">Login</a>
    </div>

  </main>

  <script>
    let currentRole = 'host';

    const tabHost = document.getElementById('tab-host');
    const tabAdmin = document.getElementById('tab-admin');
    const signupTitle = document.getElementById('signup-title');
    const signupSubtitle = document.getElementById('signup-subtitle');
    const extraLabel = document.getElementById('extra-label');
    const extraInput = document.getElementById('extra-input');
    const submitBtn = document.getElementById('submit-btn');
    const signupForm = document.getElementById('signup-form');

    // Switch to Host Registration Mode
    tabHost.addEventListener('click', () => {
      currentRole = 'host';
      tabHost.classList.add('active');
      tabAdmin.classList.remove('active');
      signupTitle.textContent = 'Host Registration';
      signupSubtitle.textContent = 'Create a host account to manage your property finishing.';
      extraLabel.innerHTML = 'Property / Business Name <span class="req">*</span>';
      extraInput.placeholder = 'e.g. ColorCraft Estates';
      submitBtn.textContent = 'Create Host Account';
    });

    // Switch to Admin Registration Mode
    tabAdmin.addEventListener('click', () => {
      currentRole = 'admin';
      tabAdmin.classList.add('active');
      tabHost.classList.remove('active');
      signupTitle.textContent = 'Admin Registration';
      signupSubtitle.textContent = 'Register an administrative access account.';
      extraLabel.innerHTML = 'Admin Security Key / Access Code <span class="req">*</span>';
      extraInput.placeholder = 'Enter Admin Key';
      submitBtn.textContent = 'Create Admin Account';
    });

    // Password Eye Toggle
    function setupPasswordToggle(btnId, inputId, iconId) {
      const btn = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (btn && input && icon) {
        btn.addEventListener('click', () => {
          const isPassword = input.type === 'password';
          input.type = isPassword ? 'text' : 'password';
          icon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
        });
      }
    }
    setupPasswordToggle('toggle-password', 'password', 'eye-icon');
    setupPasswordToggle('toggle-confirm-password', 'confirm-password', 'eye-confirm-icon');

    // Registration Form Handler
    signupForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const pwd = document.getElementById('password').value;
      const confirmPwd = document.getElementById('confirm-password').value;

      if (pwd !== confirmPwd) {
        alert('Passwords do not match. Please re-enter passwords.');
        return;
      }

      if (currentRole === 'admin') {
        sessionStorage.setItem('cc_session', '1');
        localStorage.setItem('cc_lastLogin', new Date().toISOString());
        alert('Admin account created successfully! Redirecting to Admin Dashboard...');
        window.location.href = '../admin/dashboard.html';
      } else {
        sessionStorage.setItem('cc_host_session', '1');
        alert('Host account registered successfully! Redirecting to Dashboard...');
        window.location.href = '../admin/dashboard.html';
      }
    });

    // Dark / Light Theme Toggle Functionality
    const themeBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('cc_theme', theme);
      if (theme === 'dark') {
        themeIcon.className = 'bi bi-sun';
      } else {
        themeIcon.className = 'bi bi-moon-stars';
      }
    }

    themeBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      applyTheme(newTheme);
    });

    // RTL Toggle
    document.getElementById('rtl-toggle').addEventListener('click', () => {
      const html = document.documentElement;
      const currentDir = html.getAttribute('dir');
      html.setAttribute('dir', currentDir === 'rtl' ? 'ltr' : 'rtl');
    });

    // Restore Saved Theme on Page Load
    const savedTheme = localStorage.getItem('cc_theme') || 'light';
    applyTheme(savedTheme);
  </script>

</body>
</html>
