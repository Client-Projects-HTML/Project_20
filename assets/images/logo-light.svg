<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" width="220" height="48">
  <defs>
    <linearGradient id="lgtGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="lgtGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="lgtGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="lgtGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="lgtTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(24, 24) rotate(45)">
    <rect x="-13" y="-13" width="12" height="12" rx="3" fill="url(#lgtGrad1)"/>
    <rect x="1" y="-13" width="12" height="12" rx="3" fill="url(#lgtGrad2)"/>
    <rect x="1" y="1" width="12" height="12" rx="3" fill="url(#lgtGrad3)"/>
    <rect x="-13" y="1" width="12" height="12" rx="3" fill="url(#lgtGrad4)"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    <circle cx="0" cy="0" r="1.5" fill="#0f172a"/>
  </g>

  <!-- Brand Typography for Dark Backgrounds -->
  <text x="50" y="27" font-family="'Poppins', 'Montserrat', sans-serif" font-weight="800" font-size="21" letter-spacing="-0.3">
    <tspan fill="url(#lgtTextGrad)">Color</tspan><tspan fill="#ffffff">Craft</tspan>
  </text>
  
  <text x="51" y="38" font-family="'Montserrat', sans-serif" font-weight="600" font-size="7.5" fill="#94a3b8" letter-spacing="1.5">
    PAINT &amp; WALL FINISHING
  </text>
</svg>
