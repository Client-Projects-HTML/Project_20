<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColorCraft | Admin Login</title>
    <link rel="icon" href="data:,">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Existing CSS -->
    <link rel="stylesheet" href="assets/css/admin-core.css">
    <link rel="stylesheet" href="assets/css/admin-theme.css">
</head>

<body data-page="login">

<div class="adm-login-wrap">
    <div class="adm-login-overlay"></div>

    <div class="adm-login-card">
        <!-- Top Right Controls (RTL & Theme Toggle) -->
        <div class="adm-login-header-tools">
            <button id="loginDirToggle" type="button" class="adm-login-tool-btn" aria-label="Toggle Direction" title="Toggle Direction">
                <i class="fa-solid fa-arrows-left-right"></i>
            </button>
            <button id="loginThemeToggle" type="button" class="adm-login-tool-btn" aria-label="Toggle Theme" title="Toggle Theme">
                <i class="fa-solid fa-moon icon-dark"></i>
                <i class="fa-solid fa-sun icon-light"></i>
            </button>
        </div>

        <div class="adm-login-brand">
            <div class="adm-mark">
                <i class="fa-solid fa-paint-roller"></i>
            </div>
            <h1>ColorCraft</h1>
            <h2>Welcome Back</h2>
            <p>
                Sign in to manage services,
                appointments, projects,
                customers and enquiries.
            </p>
        </div>

        <div class="adm-login-error" id="loginError"></div>

        <form id="loginForm">
            <div class="adm-field">
                <label>Email Address</label>
                <div class="adm-input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input id="loginEmail" type="email" placeholder="admin@colorcraft.com" required>
                </div>
            </div>

            <div class="adm-field">
                <label>Password</label>
                <div class="adm-input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input id="loginPassword" type="password" placeholder="Enter Password" required>
                    <i id="togglePassword" class="fa-solid fa-eye adm-password-toggle"></i>
                </div>
            </div>

            <div class="adm-check-row">
                <label>
                    <input id="loginRemember" type="checkbox">
                    Remember Me
                </label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="adm-btn adm-btn-primary adm-btn-block">
                <i class="fa-solid fa-right-to-bracket"></i>
                Login to Dashboard
            </button>
        </form>

        <div class="adm-login-actions">
            <button type="button" id="loginDemoBtn" class="adm-btn adm-btn-outline adm-btn-block">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                Autofill Demo Login
            </button>

            <a href="../pages/index.html" class="adm-back-home">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Website
            </a>
        </div>

        <div class="adm-login-footer">
            <p>© 2026 ColorCraft</p>
            <span>Professional Painting & Home Decor Admin Portal</span>
        </div>
    </div>
</div>

<script src="assets/js/admin-data.js"></script>
<script src="assets/js/admin-core.js"></script>
<script src="assets/js/admin-app.js"></script>

<script>
    // Password Visibility Toggle
    const togglePassword = document.getElementById("togglePassword");
    const password = document.getElementById("loginPassword");

    togglePassword.addEventListener("click", function() {
        if (password.type === "password") {
            password.type = "text";
            this.classList.remove("fa-eye");
            this.classList.add("fa-eye-slash");
        } else {
            password.type = "password";
            this.classList.remove("fa-eye-slash");
            this.classList.add("fa-eye");
        }
    });

    // Initialize saved preferences
    const savedTheme = localStorage.getItem("adm_theme") || "light";
    const savedDir = localStorage.getItem("adm_dir") || "ltr";

    if (savedTheme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
    }
    document.documentElement.setAttribute("dir", savedDir);

    // RTL Toggle Handler
    document.getElementById("loginDirToggle").addEventListener("click", function() {
        const isRtl = document.documentElement.getAttribute("dir") === "rtl";
        const newDir = isRtl ? "ltr" : "rtl";
        document.documentElement.setAttribute("dir", newDir);
        localStorage.setItem("adm_dir", newDir);
    });

    // Dark/Light Theme Toggle Handler
    document.getElementById("loginThemeToggle").addEventListener("click", function() {
        const isDark = document.documentElement.getAttribute("data-theme") === "dark";
        if (isDark) {
            document.documentElement.removeAttribute("data-theme");
            localStorage.setItem("adm_theme", "light");
        } else {
            document.documentElement.setAttribute("data-theme", "dark");
            localStorage.setItem("adm_theme", "dark");
        }
    });
</script>

</body>
</html>
